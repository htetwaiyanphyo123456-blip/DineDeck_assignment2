<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineDeck - Register</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="restaurants.html">Restaurants</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="reservation.html">Reservation</a></li>
            </ul>
        </nav>
        <div class="logo-container">
            <img src="images/DineDeck_Logo.png" alt="DineDeck Logo" class="logo" />
        </div>
    </header>

    <main>
        <section class="register-form-section">
            <h1>User Registration</h1>
            <form id="registerForm" method="post" action="#" novalidate>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" minlength="5" required pattern="\w+" />

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required />

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="\d{8,15}" required />

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="10" required />

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" minlength="10" required />

                <fieldset>
                    <legend>Gender:</legend>
                    <label><input type="radio" name="gender" value="Male" required /> Male</label>
                    <label><input type="radio" name="gender" value="Female" /> Female</label>
                    <label><input type="radio" name="gender" value="Other" /> Other</label>
                </fieldset>

                <label for="diet">Dietary Preferences:</label>
                <select id="diet" name="diet">
                    <option value="None" selected>None</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Halal">Halal</option>
                </select>

                <label for="country">Country/Region:</label>
                <input type="text" id="country" name="country" required />

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DineDeck. All rights reserved.</p>
    </footer>
</body>
</html>
